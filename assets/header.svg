<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ShweCorpus banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.55" stop-color="#0a2229"/>
      <stop offset="1" stop-color="#0b2b30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d47c"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- giant watermark: မြန်မာ -->
  <text x="1140" y="340" text-anchor="middle" font-size="300" fill="#ffffff" opacity="0.05"
        font-family="'Noto Serif Myanmar','Padauk',sans-serif">&#x1019;&#x103C;&#x1014;&#x103A;&#x1019;&#x102C;</text>

  <!-- floating Myanmar tokens -->
  <g font-family="'Noto Serif Myanmar','Padauk',sans-serif" fill="#e8b84b">
    <text x="120" y="300" font-size="34" opacity="0">&#x1019;&#x103C;&#x1014;&#x103A;&#x1019;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -52" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="322" font-size="28" opacity="0">&#x1005;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -44" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="985" y="315" font-size="32" opacity="0">&#x1018;&#x102C;&#x101E;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -48" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="120" font-size="26" opacity="0">&#x1015;&#x100A;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -40" dur="7s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="2.1s" repeatCount="indefinite"/>
    </text>
    <text x="1080" y="120" font-size="30" opacity="0">&#x1005;&#x1000;&#x102C;&#x1038;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -46" dur="7.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7.5s" begin="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- title -->
  <text x="640" y="168" text-anchor="middle" font-size="92" font-weight="800" fill="url(#gold)"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="3" filter="url(#glow)">ShweCorpus</text>
  <rect x="560" y="190" width="160" height="4" rx="2" fill="#2dd4bf" opacity="0.9">
    <animate attributeName="width" values="160;220;160" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="560;530;560" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="640" y="234" text-anchor="middle" font-size="25" fill="#a8c0c8" letter-spacing="5"
        font-family="-apple-system,'Segoe UI',sans-serif">OPEN BURMESE LANGUAGE DATA INFRASTRUCTURE</text>

  <!-- api line with blinking cursor -->
  <text x="600" y="288" text-anchor="middle" font-size="22" fill="#7ef0d4"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">POST /v1/proofread  &#8594;  { clean: true }</text>
  <rect x="842" y="270" width="12" height="24" fill="#7ef0d4">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting waves -->
  <g fill="#ffffff">
    <path d="M0 330 Q 160 310 320 330 T 640 330 T 960 330 T 1280 330 V360 H0 Z" opacity="0.04">
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 344 Q 160 328 320 344 T 640 344 T 960 344 T 1280 344 V360 H0 Z" opacity="0.05">
      <animateTransform attributeName="transform" type="translate" values="-60 0; 0 0; -60 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
