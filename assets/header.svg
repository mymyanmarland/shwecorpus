<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="ShweCorpus banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.55" stop-color="#0a2229"/>
      <stop offset="1" stop-color="#0b2b30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d47c"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur60" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tclip">
      <text x="640" y="180" text-anchor="middle" font-size="96" font-weight="800"
            font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="3">ShweCorpus</text>
    </clipPath>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>

  <!-- drifting aurora blobs -->
  <ellipse cx="300" cy="120" rx="260" ry="150" fill="#14b8a6" opacity="0.10" filter="url(#blur60)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 120 40; 0 0" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1000" cy="260" rx="300" ry="160" fill="#d99a2b" opacity="0.08" filter="url(#blur60)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -140 -30; 0 0" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- giant watermark: မြန်မာ -->
  <text x="1140" y="360" text-anchor="middle" font-size="300" fill="#ffffff" opacity="0.05"
        font-family="'Noto Serif Myanmar','Padauk',sans-serif">&#x1019;&#x103C;&#x1014;&#x103A;&#x1019;&#x102C;</text>

  <!-- floating Myanmar tokens (all corpus-verified spellings) -->
  <g font-family="'Noto Serif Myanmar','Padauk',sans-serif" fill="#e8b84b">
    <text x="110" y="310" font-size="34" opacity="0">&#x1019;&#x103C;&#x1014;&#x103A;&#x1019;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -56" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="8s" repeatCount="indefinite"/></text>
    <text x="300" y="330" font-size="28" opacity="0">&#x1005;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -46" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="1.2s" repeatCount="indefinite"/></text>
    <text x="975" y="320" font-size="32" opacity="0">&#x1018;&#x102C;&#x101E;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -50" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="140" y="120" font-size="26" opacity="0">&#x1015;&#x100A;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -42" dur="7s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="2.1s" repeatCount="indefinite"/></text>
    <text x="1075" y="130" font-size="30" opacity="0">&#x1005;&#x1000;&#x102C;&#x1038;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -48" dur="7.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></text>
    <text x="560" y="340" font-size="24" opacity="0">&#x1019;&#x103C;&#x1014;&#x103A;&#x1019;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -40" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="10s" begin="4s" repeatCount="indefinite"/></text>
    <text x="760" y="110" font-size="26" opacity="0">&#x1005;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -44" dur="6.5s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="6.5s" begin="1.8s" repeatCount="indefinite"/></text>
    <text x="880" y="335" font-size="28" opacity="0">&#x1018;&#x102C;&#x101E;&#x102C;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -46" dur="8.5s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="8.5s" begin="2.6s" repeatCount="indefinite"/></text>
  </g>

  <!-- title + shimmer sweep -->
  <text x="640" y="180" text-anchor="middle" font-size="96" font-weight="800" fill="url(#gold)"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="3" filter="url(#glow)">ShweCorpus</text>
  <rect x="-260" y="70" width="200" height="150" fill="url(#shine)" clip-path="url(#tclip)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1750 0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing accent bar -->
  <rect x="560" y="202" width="160" height="4" rx="2" fill="#2dd4bf">
    <animate attributeName="width" values="160;230;160" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="560;525;560" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="640" y="248" text-anchor="middle" font-size="25" fill="#a8c0c8" letter-spacing="5"
        font-family="-apple-system,'Segoe UI',sans-serif">OPEN BURMESE LANGUAGE DATA INFRASTRUCTURE</text>

  <!-- mini badges row -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" text-anchor="middle">
    <g opacity="0.9">
      <rect x="470" y="278" width="110" height="30" rx="15" fill="#0e2233" stroke="#2dd4bf"/>
      <text x="525" y="299" fill="#7ef0d4">v0.1.0</text>
    </g>
    <g opacity="0.9">
      <rect x="590" y="278" width="80" height="30" rx="15" fill="#0e2233" stroke="#2dd4bf"/>
      <text x="630" y="299" fill="#7ef0d4">MIT</text>
    </g>
    <g opacity="0.9">
      <rect x="680" y="278" width="130" height="30" rx="15" fill="#0e2233" stroke="#2dd4bf"/>
      <text x="745" y="299" fill="#7ef0d4">CC BY-SA 4.0</text>
    </g>
  </g>

  <!-- drifting waves -->
  <g fill="#ffffff">
    <path d="M0 350 Q 160 330 320 350 T 640 350 T 960 350 T 1280 350 V380 H0 Z" opacity="0.04">
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 364 Q 160 348 320 364 T 640 364 T 960 364 T 1280 364 V380 H0 Z" opacity="0.05">
      <animateTransform attributeName="transform" type="translate" values="-60 0; 0 0; -60 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
