<circle cx="1160" cy="50" r="6" fill="#28c840"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="640" y="55" text-anchor="middle" font-size="14" fill="#5b7183" font-family="-apple-system,'Segoe UI',sans-serif" letter-spacing="2">SHWECORPUS — LIVE DEMO</text>
<line x1="70" y1="72" x2="1210" y2="72" stroke="#1e3a4c" stroke-width="1"/>
<text x="100" y="130" font-size="18" fill="#7ef0d4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" clip-path="url(#clip0)">$ curl -X POST /v1/proofread -d '{"text":"&#x1031;&#x101A;&#x103A;","fix":true}'</text>
<rect x="100" y="114" width="11" height="20" fill="#7ef0d4"><animate attributeName="x" values="100;100;739;739" keyTimes="0;0.04;0.24;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.24;0.96;1" dur="14.0s" repeatCount="indefinite"/></rect>
<text x="100" y="190" font-size="18" fill="#c8d6df" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" clip-path="url(#clip1)">{"r1_spurious_e":1,"fixes_applied":1,</text>
<rect x="100" y="174" width="11" height="20" fill="#c8d6df"><animate attributeName="x" values="100;100;501;501" keyTimes="0;0.3;0.44;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.3;0.44;0.96;1" dur="14.0s" repeatCount="indefinite"/></rect>
<text x="100" y="250" font-size="18" fill="#c8d6df" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" clip-path="url(#clip2)"> "fixed_text":"<tspan fill="#f6d47c">&#x101A;&#x103A;</tspan>"}</text>
<rect x="100" y="234" width="11" height="20" fill="#c8d6df"><animate attributeName="x" values="100;100;306;306" keyTimes="0;0.5;0.6;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.5;0.6;0.96;1" dur="14.0s" repeatCount="indefinite"/></rect>
<text x="100" y="310" font-size="18" fill="#5b7183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" clip-path="url(#clip3)"># R2 skips stacked consonants: both AA variants are correct</text>
<rect x="100" y="294" width="11" height="20" fill="#5b7183"><animate attributeName="x" values="100;100;739;739" keyTimes="0;0.66;0.8;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.66;0.8;0.96;1" dur="14.0s" repeatCount="indefinite"/></rect>
