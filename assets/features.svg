<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="ShweCorpus features">
  <defs>
    <linearGradient id="fnodebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10293a"/>
      <stop offset="1" stop-color="#0b1c29"/>
    </linearGradient>
    <filter id="fglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="300" fill="#071018" rx="18"/>

  <g font-family="-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <!-- card 1 -->
    <g>
      <rect x="40" y="60" width="280" height="180" rx="16" fill="url(#fnodebg)" stroke="#1e3a4c" stroke-width="1.5"/>
      <rect x="40" y="60" width="280" height="180" rx="16" fill="none" stroke="#e8b84b" stroke-width="2.5" filter="url(#fglow)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.2;0.25;0.45;0.5;1;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="180" y="112" font-size="34">&#x1F50D;</text>
      <text x="180" y="148" font-size="20" font-weight="700" fill="#f6d47c" letter-spacing="2">PROOFREAD</text>
      <text x="180" y="176" font-size="14" fill="#9fb3c8">R1 &#183; R2 &#183; R3 &#183; AY rules,</text>
      <text x="180" y="198" font-size="14" fill="#9fb3c8">every one corpus-verified</text>
      <text x="180" y="222" font-size="13" fill="#2dd4bf" font-family="ui-monospace,monospace">POST /v1/proofread</text>
    </g>
    <!-- card 2 -->
    <g>
      <rect x="360" y="60" width="280" height="180" rx="16" fill="url(#fnodebg)" stroke="#1e3a4c" stroke-width="1.5"/>
      <rect x="360" y="60" width="280" height="180" rx="16" fill="none" stroke="#e8b84b" stroke-width="2.5" filter="url(#fglow)" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.25;0.45;0.5;0.7;0.75;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="500" y="112" font-size="34">&#x2702;&#xFE0F;</text>
      <text x="500" y="148" font-size="20" font-weight="700" fill="#f6d47c" letter-spacing="2">TOKENIZE</text>
      <text x="500" y="176" font-size="14" fill="#9fb3c8">rule-based Burmese</text>
      <text x="500" y="198" font-size="14" fill="#9fb3c8">syllable splitter</text>
      <text x="500" y="222" font-size="13" fill="#2dd4bf" font-family="ui-monospace,monospace">POST /v1/tokenize</text>
    </g>
    <!-- card 3 -->
    <g>
      <rect x="680" y="60" width="280" height="180" rx="16" fill="url(#fnodebg)" stroke="#1e3a4c" stroke-width="1.5"/>
      <rect x="680" y="60" width="280" height="180" rx="16" fill="none" stroke="#e8b84b" stroke-width="2.5" filter="url(#fglow)" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.5;0.7;0.75;0.95;1;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="820" y="112" font-size="34">&#x1F4D6;</text>
      <text x="820" y="148" font-size="20" font-weight="700" fill="#f6d47c" letter-spacing="2">WORD LOOKUP</text>
      <text x="820" y="176" font-size="14" fill="#9fb3c8">codepoints + corpus</text>
      <text x="820" y="198" font-size="14" fill="#9fb3c8">attestation + examples</text>
      <text x="820" y="222" font-size="13" fill="#2dd4bf" font-family="ui-monospace,monospace">GET /v1/word/&#8230;</text>
    </g>
    <!-- card 4 -->
    <g>
      <rect x="1000" y="60" width="240" height="180" rx="16" fill="url(#fnodebg)" stroke="#1e3a4c" stroke-width="1.5"/>
      <rect x="1000" y="60" width="240" height="180" rx="16" fill="none" stroke="#e8b84b" stroke-width="2.5" filter="url(#fglow)" opacity="0">
        <animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.05;0.7;0.95;1;1;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="1120" y="112" font-size="34">&#x1F5C4;</text>
      <text x="1120" y="148" font-size="20" font-weight="700" fill="#f6d47c" letter-spacing="2">CORPUS</text>
      <text x="1120" y="176" font-size="14" fill="#9fb3c8">205 clean Wikipedia</text>
      <text x="1120" y="198" font-size="14" fill="#9fb3c8">docs, CC BY-SA 4.0</text>
      <text x="1120" y="222" font-size="13" fill="#2dd4bf" font-family="ui-monospace,monospace">rebuildable</text>
    </g>
  </g>

  <text x="640" y="278" text-anchor="middle" font-size="14" fill="#5b7183"
        font-family="-apple-system,'Segoe UI',sans-serif" letter-spacing="3">LIBRARY + HTTP API &#8212; PICK EITHER</text>
</svg>
