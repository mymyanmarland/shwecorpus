<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="ShweCorpus pipeline">
  <defs>
    <linearGradient id="nodebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10293a"/>
      <stop offset="1" stop-color="#0b1c29"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="250" fill="#071018" rx="18"/>

  <!-- connectors: marching ants + travelling pulse -->
  <g stroke="#e8b84b" stroke-width="2.5" fill="none" opacity="0.85">
    <line x1="280" y1="125" x2="400" y2="125" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="125" x2="720" y2="125" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="125" x2="1040" y2="125" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#e8b84b">
    <circle r="7" opacity="0.95">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M280 125 L400 125"/>
    </circle>
    <circle r="7" opacity="0.95">
      <animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M600 125 L720 125"/>
    </circle>
    <circle r="7" opacity="0.95">
      <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M920 125 L1040 125"/>
    </circle>
  </g>

  <!-- nodes -->
  <g font-family="-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="70" width="240" height="110" rx="16" fill="url(#nodebg)" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="160" y="112" font-size="30">&#x1F5C4;</text>
      <text x="160" y="142" font-size="19" font-weight="700" fill="#f6d47c" letter-spacing="2">CORPUS</text>
      <text x="160" y="164" font-size="14" fill="#9fb3c8">205 Wikipedia docs</text>
    </g>
    <g>
      <rect x="360" y="70" width="240" height="110" rx="16" fill="url(#nodebg)" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="480" y="112" font-size="30">&#x1F50D;</text>
      <text x="480" y="142" font-size="19" font-weight="700" fill="#f6d47c" letter-spacing="2">PROOFREAD</text>
      <text x="480" y="164" font-size="14" fill="#9fb3c8">R1 &#183; R2 &#183; R3 &#183; AY</text>
    </g>
    <g>
      <rect x="680" y="70" width="240" height="110" rx="16" fill="url(#nodebg)" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="800" y="112" font-size="30">&#x2702;&#xFE0F;</text>
      <text x="800" y="142" font-size="19" font-weight="700" fill="#f6d47c" letter-spacing="2">TOKENIZE</text>
      <text x="800" y="164" font-size="14" fill="#9fb3c8">syllable splitter</text>
    </g>
    <g>
      <rect x="1000" y="70" width="240" height="110" rx="16" fill="url(#nodebg)" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="1120" y="112" font-size="30">&#x26A1;</text>
      <text x="1120" y="142" font-size="19" font-weight="700" fill="#f6d47c" letter-spacing="2">API</text>
      <text x="1120" y="164" font-size="14" fill="#9fb3c8">/v1 &#183; free forever</text>
    </g>
  </g>

  <text x="640" y="222" text-anchor="middle" font-size="15" fill="#5b7183"
        font-family="-apple-system,'Segoe UI',sans-serif" letter-spacing="3">EVERY RULE VERIFIED AGAINST THE CORPUS &#8212; NOTHING HAND-TUNED</text>
</svg>
